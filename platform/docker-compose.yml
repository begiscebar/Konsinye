services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: konsinye
      POSTGRES_PASSWORD: konsinye
      POSTGRES_DB: konsinye_freight
    ports:
      - "5432:5432"
    volumes:
      - konsinye_pgdata:/var/lib/postgresql/data

volumes:
  konsinye_pgdata:
